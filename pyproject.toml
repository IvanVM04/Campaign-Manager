[project]
name = "campaign-manager"
version = "0.1.0"
description = "Campaign world state and operation engine"
requires-python = ">=3.12"

dependencies = [
    "fastapi",
    "uvicorn[standard]",
]

[dependency-groups]
test = [
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "httpx2==2.16.0",
]
lint = [
    "ruff==0.17.4",
]
typing = [
    "pyright==1.1.414",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "real_llm: tests that require a running Ollama instance",
]

[tool.coverage.run]
branch = true
source = ["."]
omit = [
    "tests/*",
    "*/tests/*",
    "scripts/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
fail_under = 85
