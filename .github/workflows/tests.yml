name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --group test

      - name: Run deterministic tests with coverage
        run: |
          python -m pytest -m "not real_llm" --cov --cov-report=term-missing --cov-report=xml

      - name: Publish package coverage summary
        if: always()
        run: python scripts/ci/coverage_summary.py coverage.xml --github-summary "$GITHUB_STEP_SUMMARY"

      # Enforce the configured fail_under independently of pytest-cov's
      # session hook so a printed threshold failure cannot leave CI green.
      - name: Enforce combined coverage floor
        if: success()
        run: python -m coverage report

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python-coverage-report
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 14

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: |
          python -m pip install --upgrade pip
          pip install --group lint

      - name: Run Ruff
        run: |
          ruff check .

  pyright-rules-engine:
    name: Pyright (models, rules_engine, bootstrap, operations)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install application dependencies and Pyright
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --group typing

      - name: Check clean package scopes
        run: pyright models rules_engine bootstrap operations

  pyright-baseline:
    name: Pyright (repository-wide)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install application dependencies and Pyright
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --group typing

      - name: Collect Pyright baseline
        run: |
          set +e
          pyright --outputjson > pyright-report.json
          status=$?
          set -e
          if [ "$status" -gt 1 ]; then
            cat pyright-report.json
            exit "$status"
          fi
          python - <<'PY'
          import json
          import os
          from collections import Counter

          with open("pyright-report.json", encoding="utf-8") as report_file:
              report = json.load(report_file)

          diagnostics = report.get("generalDiagnostics", [])
          counts = Counter(item.get("severity", "unknown") for item in diagnostics)
          errors = counts.get("error", 0)
          summary = (
              "## Repository-wide Pyright\n\n"
              f"- Diagnostics: {len(diagnostics)}\n"
              f"- Errors: {errors}\n"
              f"- Warnings: {counts.get('warning', 0)}\n"
              f"- Information: {counts.get('information', 0)}\n"
              "\nFull diagnostics are available in the pyright-baseline artifact.\n"
          )
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
              output.write(summary)
          print(summary)
          if errors:
              raise SystemExit(f"Repository-wide Pyright found {errors} errors.")
          PY

      - name: Upload Pyright baseline
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pyright-baseline
          path: pyright-report.json
          if-no-files-found: ignore
          retention-days: 14

  test-js:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Run JavaScript tests
        run: npm run test:js

  test-powershell:
    name: PowerShell runner syntax and report tests
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install application and test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --group test

      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $scriptPath = Join-Path $env:GITHUB_WORKSPACE "scripts/run-ollama-tests.ps1"
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            $scriptPath,
            [ref]$tokens,
            [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | Format-List | Out-String | Write-Error
            exit 1
          }
          Write-Host "PowerShell syntax validation passed."

      - name: Run orchestrator and report contract tests
        shell: pwsh
        run: |
          python -m pytest tests/test_ollama_powershell_runner.py tests/test_quality_run_report.py -q
  ci-summary:
    name: CI summary
    if: always()
    needs:
      - test
      - lint
      - pyright-rules-engine
      - pyright-baseline
      - test-js
      - test-powershell
    runs-on: ubuntu-latest

    steps:
      - name: Publish check summary
        env:
          TEST_RESULT: ${{ needs.test.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          PYRIGHT_REQUIRED_RESULT: ${{ needs.pyright-rules-engine.result }}
          PYRIGHT_BASELINE_RESULT: ${{ needs.pyright-baseline.result }}
          JS_RESULT: ${{ needs.test-js.result }}
          POWERSHELL_RESULT: ${{ needs.test-powershell.result }}
        run: |
          {
            echo "## CI check summary"
            echo
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| Python deterministic tests | $TEST_RESULT |"
            echo "| Ruff | $LINT_RESULT |"
            echo "| Required Pyright scope | $PYRIGHT_REQUIRED_RESULT |"
            echo "| Repository-wide Pyright | $PYRIGHT_BASELINE_RESULT |"
            echo "| JavaScript tests | $JS_RESULT |"
            echo "| PowerShell runner validation | $POWERSHELL_RESULT |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$TEST_RESULT" != "success" ] ||
             [ "$LINT_RESULT" != "success" ] ||
             [ "$PYRIGHT_REQUIRED_RESULT" != "success" ] ||
             [ "$PYRIGHT_BASELINE_RESULT" != "success" ] ||
             [ "$JS_RESULT" != "success" ] ||
             [ "$POWERSHELL_RESULT" != "success" ]; then
            echo "One or more CI jobs did not succeed."
            exit 1
          fi
