name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov "httpx2>=2.5"

      - name: Run deterministic tests with coverage
        run: |
          python -m pytest -m "not real_llm" --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python-coverage-report
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 14

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff
        run: |
          ruff check .

  pyright-rules-engine:
    name: Pyright (models, rules_engine, bootstrap, operations)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install application dependencies and Pyright
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pyright==1.1.414"

      - name: Check clean package scopes
        run: pyright models rules_engine bootstrap operations

  pyright-baseline:
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install application dependencies and Pyright
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pyright==1.1.414"

      - name: Collect Pyright baseline
        run: |
          set +e
          pyright --outputjson > pyright-report.json
          status=$?
          set -e
          if [ "$status" -gt 1 ]; then
            cat pyright-report.json
            exit "$status"
          fi
          python - <<'PY'
          import json
          import os
          from collections import Counter

          with open("pyright-report.json", encoding="utf-8") as report_file:
              report = json.load(report_file)

          diagnostics = report.get("generalDiagnostics", [])
          counts = Counter(item.get("severity", "unknown") for item in diagnostics)
          summary = (
              "## Pyright baseline (informational)\n\n"
              f"- Diagnostics: {len(diagnostics)}\n"
              f"- Errors: {counts.get('error', 0)}\n"
              f"- Warnings: {counts.get('warning', 0)}\n"
              f"- Information: {counts.get('information', 0)}\n"
              "\nFull diagnostics are available in the pyright-baseline artifact.\n"
          )
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
              output.write(summary)
          print(summary)
          PY

      - name: Upload Pyright baseline
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pyright-baseline
          path: pyright-report.json
          if-no-files-found: ignore
          retention-days: 14

  test-js:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Run JavaScript tests
        run: npm run test:js
